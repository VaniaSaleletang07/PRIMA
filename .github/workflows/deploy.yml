name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Pindah ke direktori root aplikasi di server
            # Ganti '/var/www/prima' sesuai dengan lokasi folder web Anda nanti
            cd /var/www/prima
            
            # Tarik kode terbaru dari branch main di GitHub
            git pull origin main
            
            # (Opsional) Jika ada pengaturan folder permission setelah pull
            # sudo chown -R www-data:www-data /var/www/prima/uploads/
            # sudo chmod -R 775 /var/www/prima/uploads/
            
            echo "🚀 Deployment Berhasil!"
